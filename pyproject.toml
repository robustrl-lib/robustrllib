[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robustrllib"
version = "0.1.0"
description = "A unified library and benchmark for robust reinforcement learning algorithms."
readme = "README.md"
requires-python = ">= 3.9"
license = { text = "MIT License" }
keywords = ["reinforcement learning", "robust reinforcement learning", "benchmark", "distribution shift"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy >= 1.21.0",
    "cloudpickle >= 1.2.0",
    "typing-extensions >= 4.3.0",
    "farama-notifications >= 0.0.1",
    "gymnasium >= 0.29",
    "pyyaml >= 6.0",
]

[project.optional-dependencies]
mujoco = ["mujoco >= 2.3.3", "imageio >= 2.14.1"]
box2d = ["box2d-py == 2.3.5", "pygame >= 2.1.3", "swig == 4.*"]
robosuite = ["mujoco >= 2.3.3", "numba >= 0.49.1", "opencv-python", "termcolor"]
methods = [
    "torch >= 2.0", "stable-baselines3 >= 2.3", "sb3-contrib >= 2.3", "minari >= 0.4",
    "ema-pytorch", "gtimer", "joblib", "python-dateutil", "matplotlib",
]
all = [
    "mujoco >= 2.3.3", "imageio >= 2.14.1", "box2d-py == 2.3.5", "pygame >= 2.1.3", "swig == 4.*",
    "numba >= 0.49.1", "opencv-python", "termcolor",
    "torch >= 2.0", "stable-baselines3 >= 2.3", "sb3-contrib >= 2.3", "minari >= 0.4",
    "ema-pytorch", "gtimer", "joblib", "python-dateutil", "matplotlib",
]
testing = ["pytest >= 7.1"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["robustrllib", "robustrllib.*"]

[tool.setuptools.package-data]
robustrllib = [
    "configs/**/*.yaml",
    "gym/envs/**/*.xml", "gym/envs/**/*.png", "gym/envs/**/*.stl",
    "gym/envs/**/*.json", "gym/envs/**/*.md", "gym/envs/LICENSE_GYMNASIUM_ROBOTICS",
    "gym/envs/robosuite/LICENSE", "gym/py.typed",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:robustrllib.*:"]
