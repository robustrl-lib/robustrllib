# RORL (Yang et al., 2022): the paper's RORL table; the experiment cards set each task's
# smoothing and out-of-distribution settings.
name: rorl
entry: baselines/rorl/train.py
class: baselines.rorl.policy:RORLPolicy
checkpoint: last
hparams:
  num_qs: 10                    # critic ensemble
  hidden_size: 256
  num_q_layers: 3
  num_policy_layers: 3
  policy_lr: 3.0e-4
  qf_lr: 3.0e-4
  discount: 0.99
  soft_target_tau: 0.005
  target_update_period: 1
  reward_scale: 1.0
  use_automatic_entropy_tuning: true
  target_entropy: null          # minus the action dimension
  max_q_backup: false
  deterministic_backup: false
  eta: -1.0
  q_smooth_reg: 1.0e-4
  q_smooth_tau: 0.2
  num_samples: 20
  policy_smooth_eps: 0.005
  policy_smooth_reg: 0.1
  q_smooth_eps: 0.005
  q_ood_eps: 0.01
  q_ood_reg: 0.5
  q_ood_uncertainty_reg: 0.0
  q_ood_uncertainty_reg_min: 0.0
  q_ood_uncertainty_decay: 0.0
  policy_eval_start: 20000      # behaviour cloning only for the first updates
  bc_regularization_weight: 1.0 # behaviour-cloning anchor on the actor ...
  bc_regularization_start: 20000  # ... from this update on
  batch_size: 256
