# SynthER (Lu et al., 2023): IQL trained on transitions generated by a diffusion model of the
# dataset, observations normalised with the real data; the paper's SynthER and IQL tables.
name: synther
entry: baselines/synther/train.py
class: baselines.iql.policy:IQLPolicy
checkpoint: last
hparams:
  expectile: 0.7       # IQL backbone: the paper's IQL table
  beta: 3.0
  adv_clip: 100.0
  lr: 3.0e-4
  hidden: 256
  dropout: 0.0
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  num_samples: 5000000      # generated transitions
  sample_batch_size: 100000
  samples: null             # existing samples (.npz); generated when null
  diffusion:
    width: 2048             # residual MLP denoiser
    layers: 6
    time_dim: 128
    fourier_dim: 16         # random Fourier time features
    sample_steps: 128
    sigma_data: 1.0
    s_churn: 80.0
    lr: 3.0e-4              # cosine schedule
    batch_size: 1024        # 256 below 800k transitions
    steps: 100000
