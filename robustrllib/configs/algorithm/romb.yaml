# ROMB: IQL with an adversarially fine-tuned world model; the paper's ROMB table.
name: romb
entry: baselines/romb/train.py
class: baselines.iql.policy:IQLPolicy
checkpoint: last
hparams:
  expectile: 0.7       # IQL backbone: the paper's IQL table
  beta: 3.0
  adv_clip: 100.0
  lr: 3.0e-4
  hidden: 256
  dropout: 0.0
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  robust_every: 10              # ROMB update every n-th update
  n_ensemble: 7                 # dynamics ensemble
  n_elites: 5
  dynamics_hidden_dims: [200, 200, 200, 200]
  dynamics_weight_decay: [2.5e-5, 5.0e-5, 7.5e-5, 7.5e-5, 1.0e-4]
  dynamics_lr: 1.0e-3
  dynamics_max_epochs: 30
  dynamics_batch_size: 256
  rollout_length: 5
  rollout_batch_size: 256
  gae_lambda: 0.95
  clip_range: 0.2               # PPO clip of the adversarial model update
  sl_weight: 3000.0             # divisor of the adversarial term against the supervised one
  actor_pg_coef: 0.1
  model_target_ratio: 0.5       # weight of model transitions in the critic loss
  use_gradient_mask: true
  grad_clip_norm: 1.0
  second_order_horizon: 10
