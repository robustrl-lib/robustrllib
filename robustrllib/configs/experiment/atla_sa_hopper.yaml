# ATLA-SA-PPO on Hopper-v5. The same run is evaluated on part2_hopper.yaml and part3_hopper.yaml;
# `--train-shift <arm>` trains the Part 2 training-time channels.
name: atla_sa_hopper
algorithm: robustrllib/configs/algorithm/atla_sa.yaml
task: robustrllib/configs/task/hopper.yaml
eval: robustrllib/configs/eval/part1_mujoco.yaml
hparams:
  robust_ppo_eps: 0.075
  robust_ppo_reg: 0.3
  ppo_lr_adam: 1.0e-3
  val_lr: 1.0e-2
  adv_ppo_lr_adam: 1.0e-2
  adv_val_lr: 1.0e-2
  adv_adversary_steps: 1
  initial_std: 1.0
  history_length: 100
train: {steps: 4999168}   # 2441 iterations x 2048 steps
