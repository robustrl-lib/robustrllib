# RSC-SAC on robosuite DoorCausal, trained on the hhl binding; the semantic channel
# evaluates hhl and the inverted binding hhr. The 40 trailing entries (the arm's own
# joint state) are never intervened on.
name: rsc_doorcausal
algorithm: robustrllib/configs/algorithm/rsc.yaml
task: robustrllib/configs/task/doorcausal.yaml
eval: robustrllib/configs/eval/part2_doorcausal.yaml
hparams:
  net_arch: [256, 256, 256]
  batch_size: 128
  train_freq: 10
  gradient_steps: 1
  learning_starts: 0
  protect_last: 40
train: {steps: 1000000}
